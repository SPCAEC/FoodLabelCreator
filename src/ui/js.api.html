<script>
/**
 * Client wrapper for google.script.run → backend RPCs
 * Updated November 2025 for:
 *  ✅ Correct unwrapping of rpcTry({ ok, data }) responses
 *  ✅ PFP-prefixed UPC normalization
 *  ✅ Backward-compatible AI extraction and label creation
 */
(function () {
  // ────────────────────────────────────────────────
  // Base GSR wrapper (Promise-based)
  // ────────────────────────────────────────────────
  function _gsr(method, ...args) {
    return new Promise((resolve, reject) => {
      try {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[method](...args);
      } catch (err) {
        console.error('[API] google.script.run error', err);
        reject(err);
      }
    });
  }

  // ────────────────────────────────────────────────
  // UPC normalization helpers
  // ────────────────────────────────────────────────
  function normalizeUPC(raw) {
    let s = String(raw || '').replace(/\D/g, '');
    if (s.length === 13 && s.startsWith('0')) s = s.slice(1); // EAN-13 → 12
    if (s.length > 13) return '';
    if (s.length < 12) s = s.padStart(12, '0');
    return s;
  }
  const toSheetKey = upc12 => (upc12 ? `PFP${upc12}` : '');

  // ────────────────────────────────────────────────
  // Image helpers
  // ────────────────────────────────────────────────
  function pickImageFromPayload(obj, preferFront = true) {
    if (!obj || typeof obj !== 'object') return null;
    const candidates = preferFront
      ? ['frontDataUrl', 'front', 'frontImage', 'front_data_url', 'frontImageData']
      : ['ingDataUrl', 'ingredients', 'ingredientsDataUrl', 'ingredients_url', 'ing'];
    for (const k of candidates) {
      if (k in obj && obj[k]) return obj[k];
    }
    return null;
  }

  // ────────────────────────────────────────────────
  // Public API
  // ────────────────────────────────────────────────
  const API = {
    /**
     * Lookup by UPC
     * Always unwraps rpcTry → { found, item } shape
     */
    lookup(raw) {
      const upc = normalizeUPC(raw);
      if (upc.length !== 12) {
        return Promise.resolve({ found: false, reason: 'invalid_length', sent: upc });
      }

      const key = toSheetKey(upc);
      console.log('[API.lookup] Sending lookup for', key);

      return _gsr('apiLookup', { upc }).then(res => {
        // unwrap rpcTry({ ok, data }) or nested formats
        if (res && typeof res === 'object') {
          if ('data' in res) return res.data;
          if ('ok' in res && res.ok && typeof res.ok === 'object' && 'data' in res.ok)
            return res.ok.data;
        }
        return res;
      });
    },

    /**
     * Create or update a label record
     * Tries apiCreateLabels, falls back to apiSaveAndCreateLabel
     */
    createLabels(payload) {
      return _gsr('apiCreateLabels', payload)
        .catch(() => _gsr('apiSaveAndCreateLabel', payload));
    },

    /** Uploads a front image (base64 DataURL) */
    uploadFront(upc, dataUrl) {
      const n = normalizeUPC(upc);
      return _gsr('apiUploadFront', n, dataUrl);
    },

    /** Uploads an ingredients image (base64 DataURL) */
    uploadIngredients(upc, dataUrl) {
      const n = normalizeUPC(upc);
      return _gsr('apiUploadIngredients', n, dataUrl);
    },

    /**
     * Extract label data from images
     * Supports:
     *  - extract(frontDataUrl, ingredientsDataUrl)
     *  - extract({ frontDataUrl, ingDataUrl })
     */
    extract(a, b) {
      if (arguments.length === 1 && a && typeof a === 'object') {
        const front = pickImageFromPayload(a, true) || null;
        const ingredients = pickImageFromPayload(a, false) || null;
        return _gsr('apiExtractFromImages', { front, ingredients });
      }

      const frontArg = typeof a === 'string' ? a : null;
      const ingArg = typeof b === 'string' ? b : null;
      return _gsr('apiExtractFromImages', { front: frontArg, ingredients: ingArg });
    }
  };

  // Expose globally
  window.API = API;
})();
</script>
