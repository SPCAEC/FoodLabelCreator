<!-- New product photo capture -->
<section id="screenNew" class="screen">
  <div id="photoSteps" class="card centered">
    <h2>New Product Detected</h2>
    <p class="subtitle">
      We’ll need two clear photos to create the label. Follow the steps below!
    </p>

    <!-- 🆕 Start Over button (moved under subtitle for consistent layout) -->
    <div class="actions" style="margin-bottom: 1.5rem;">
      <button id="startoverBtn" class="btn startover startOver" type="button">
        Start Over
      </button>
    </div>

    <!-- Step 1 + Step 2 Grid -->
    <div class="photo-grid">
      <!-- Step 1: Front -->
      <div class="photo-block" id="frontBlock">
        <label><strong>Step 1:</strong> Full front of the bag, box, or can</label>
        <img id="frontPreview" class="preview hidden" alt="Front photo preview" />
        <button id="frontBtn" class="btn camera-btn" type="button">
          📸 Take Front Photo
        </button>
      </div>

      <!-- Step 2: Ingredients (hidden until Step 1 complete) -->
      <div id="ingredientsBlock" class="photo-block hidden">
        <label><strong>Step 2:</strong> Ingredients label (flat, good lighting)</label>
        <img
          id="ingredientsPreview"
          class="preview hidden"
          alt="Ingredients photo preview"
        />
        <button id="ingredientsBtn" class="btn camera-btn" type="button">
          📸 Take Ingredients Photo
        </button>
      </div>
    </div>

    <!-- Continue Button (hidden until both photos are taken) -->
    <div id="photoActions" class="actions hidden" style="margin-top: 2rem;">
      <button id="photoContinue" class="btn" type="button">
        Continue
      </button>
    </div>
  </div>
</section>
