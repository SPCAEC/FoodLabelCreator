<script>
(function () {
  // ──────────────────────────────────────────────────────────────
  // Tiny helpers
  // ──────────────────────────────────────────────────────────────
  const $  = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];

  const smoothScroll = (el, block = "center") => {
    if (!el) return;
    try {
      el.scrollIntoView({ behavior: "smooth", block });
    } catch (_) {}
  };

  const isValidUPC = (v) => /^\d{12}$/.test(String(v || "").trim());
  const isValidUS  = (v) => /^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])\/\d{4}$/.test(String(v || ""));
  const isISO      = (v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || ""));

  const toUS = (val) => {
    // yyyy-mm-dd  → mm/dd/yyyy
    if (isISO(val)) {
      const [y, m, d] = val.split("-");
      return `${m}/${d}/${y}`;
    }
    return val;
  };

  const autoFormatUS = (raw) => {
    // user types digits only -> we insert slashes: 02122025 -> 02/12/2025
    let v = String(raw || "").replace(/\D/g, "").slice(0, 8);
    if (v.length >= 5) return `${v.slice(0,2)}/${v.slice(2,4)}/${v.slice(4)}`;
    if (v.length >= 3) return `${v.slice(0,2)}/${v.slice(2)}`;
    return v;
  };

  function setMsg(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.className = "msg";
    if (type) el.classList.add(type);
  }

  function spinner(on, el) {
    if (!el) return;
    el.toggleAttribute("hidden", !on);
    el.style.display = on ? "inline-block" : "none";
  }

  // ──────────────────────────────────────────────────────────────
  // Processing overlay (full-screen)
  // ──────────────────────────────────────────────────────────────
  let processingEl = null;
  function showProcessing(msg) {
    if (!processingEl) {
      processingEl = document.createElement("div");
      processingEl.id = "processingOverlay";
      processingEl.style.cssText = `
        position:fixed; inset:0; background:rgba(255,255,255,.95);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        z-index:9999; text-align:center; padding:2rem;
      `;
      processingEl.innerHTML = `
        <div class="spinner" style="width:2.2rem;height:2.2rem;margin-bottom:1rem;"></div>
        <div id="processingText" style="font-weight:700;"></div>
      `;
      document.body.appendChild(processingEl);
    }
    processingEl.querySelector('#processingText').textContent = msg || 'Working…';
    processingEl.style.display = 'flex';
  }
  function hideProcessing() {
    if (processingEl) processingEl.style.display = 'none';
  }

  // ──────────────────────────────────────────────────────────────
  // App state
  // ──────────────────────────────────────────────────────────────
  const state = {
    upc: '',
    item: null,
    exp: '',
    photos: { front: null, ingredients: null },
    pdf: { url: '', id: '' },
    needs: { ingredients: false }
  };

  // ──────────────────────────────────────────────────────────────
  // Navigation
  // ──────────────────────────────────────────────────────────────
  function navigate(id) {
    $$('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    if (el) {
      el.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function resetApp() {
    // 🔄 Reset in-memory state
    Object.assign(state, {
      upc: '',
      item: null,
      exp: '',
      photos: { front: null, ingredients: null },
      pdf: { url: '', id: '' },
      needs: { ingredients: false }
    });

    // 🧹 Clear and reset UI elements safely
    const upcInput = $('#upcInput');
    const lookupBtn = $('#lookupBtn');
    const statusEl = $('#launchInfo');

    if (upcInput) upcInput.value = '';
    if (lookupBtn) lookupBtn.setAttribute('disabled', '');
    if (statusEl) setMsg(statusEl, '');

    // 🧭 Navigate back to launch screen
    navigate('screenLaunch');
    setTimeout(() => smoothScroll($('#screenLaunch'), 'start'), 100);

    // 🚫 Hide all Start Over buttons again
    if (typeof window.hideStartOver === 'function') window.hideStartOver();

    console.log('[resetApp] App state reset and returned to launch screen');
  }

  function wireGlobal() {
    // Wire up the Start Over button(s)
    const startButtons = $$('.startOver');
    startButtons.forEach(btn => {
      btn.addEventListener('click', resetApp);
      btn.style.display = 'none'; // hide initially
    });

    // Small helper we can call elsewhere
    window.showStartOver = () => {
      startButtons.forEach(btn => (btn.style.display = 'inline-block'));
    };
    window.hideStartOver = () => {
      startButtons.forEach(btn => (btn.style.display = 'none'));
    };
  }

  // ──────────────────────────────────────────────────────────────
  // Launch screen (UPC entry / scan)
  // ──────────────────────────────────────────────────────────────
  function wireLaunch() {
    const input    = $('#upcInput');
    const lookup   = $('#lookupBtn');
    const scan     = $('#scanBtn');
    const clearBtn = $('#clearBtn');
    const status   = $('#launchInfo');
    const load     = $('#launchLoad');

    function updateBtn() {
      lookup.disabled = !isValidUPC(input.value);
    }

    input?.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 12);
      updateBtn();
    });

    lookup?.addEventListener('click', async () => {
      if (lookup.disabled) return;
      state.upc = input.value;
      await doLookup(status, load);
    });

    scan?.addEventListener('click', () => {
      setMsg(status, 'Opening scanner…');
      window.MiniScanner?.open?.();
    });

    clearBtn?.addEventListener('click', () => {
      input.value = '';
      updateBtn();
      setMsg(status, '');
    });

    updateBtn();
    spinner(false, load);
  }

  async function doLookup(statusEl, loadEl) {
    setMsg(statusEl, 'Looking up barcode…');
    spinner(true, loadEl);

    try {
      const raw = await API.lookup(state.upc);
      console.log('[LOOKUP RAW]', JSON.stringify(raw, null, 2));
      const res = raw?.data || raw;

      if (res && res.found && res.item) {
        // ✅ Existing item found in sheet
        state.item = normalizeItem(res.item);
        state.exp = formatDateFromSheet(res.item.Expiration);

        navigate('screenReview');
        setTimeout(renderReview, 0);
        setTimeout(() => smoothScroll($('#screenReview'), 'start'), 50);

        // ✅ Show "Start Over" button after successful lookup
        if (typeof window.showStartOver === 'function') window.showStartOver();
      } else {
        // 🆕 New item — go to photo capture flow
        state.item = null;
        navigate('screenNew');
        setTimeout(() => smoothScroll($('#screenNew .card'), 'start'), 50);

        // ✅ Also show "Start Over" for new-item flow
        if (typeof window.showStartOver === 'function') window.showStartOver();
      }

      // Clear status message
      setMsg(statusEl, '');
    } catch (err) {
      console.error('[lookup error]', err);
      setMsg(statusEl, 'Lookup failed. Please try again.', 'error');
    } finally {
      spinner(false, loadEl);
    }
  }

  window.addEventListener('upc-scanned', async ev => {
    const upc = ev.detail?.upc || '';
    $('#upcInput').value = upc;
    $('#lookupBtn').disabled = !isValidUPC(upc);
    setMsg($('#launchInfo'), 'Scanned ✓ Looking up…', 'success');
    spinner(true, $('#launchLoad'));
    try {
      state.upc = upc;
      await doLookup($('#launchInfo'), $('#launchLoad'));
    } catch {
      setMsg($('#launchInfo'), 'Scan failed.', 'error');
    }
    spinner(false, $('#launchLoad'));
  });

  window.addEventListener('upc-scan-canceled', () => {
    setMsg($('#launchInfo'), 'Scanner closed.');
  });

  // ──────────────────────────────────────────────────────────────
  // Item helpers
  // ──────────────────────────────────────────────────────────────
  function normalizeItem(item) {
    return {
      upc:         String(item.upc || ''),
      brand:       String(item.brand || ''),
      productName: String(item.productName || ''),
      flavor:      String(item.flavor || ''),
      species:     String(item.species || ''),
      lifestage:   String(item.lifestage || ''),
      ingredients: String(item.ingredients || ''),
      type:        String(item.type || item['Treat or Food'] || 'Food')
    };
  }

  function formatDateFromSheet(date) {
    try {
      const d = new Date(date);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    } catch {
      return '';
    }
  }

  // ──────────────────────────────────────────────────────────────
  // Review screen (expiration + details + create label)
  // ──────────────────────────────────────────────────────────────
  function renderReview() {
    const i = state.item || {};
    const expEl = $('#revExp');

    // Respect picker (date) but display US
    if (expEl) {
      const prefill = state.exp || '';
      expEl.value = isISO(prefill) ? toUS(prefill) : prefill;
    }

    $('#revSpecies').value     = i.species || 'Dog';
    $('#revStage').value       = i.lifestage || 'Adult';
    $('#revBrand').value       = i.brand || '';
    $('#revName').value        = i.productName || '';
    $('#revFlavor').value      = i.flavor || '';
    $('#revIngredients').value = i.ingredients || '';
    $('#revTreatFood').value   = i.type || 'Food';
  }

  function wireReviewScreen() {
    const saveBtn    = $('#revSave');
    const expInput   = $('#revExp');
    const typeSelect = $('#revTreatFood');
    const status     = $('#revStatus');
    const load       = $('#revLoad');

    const updateSaveBtn = () => {
      const raw  = expInput.value.trim();
      const us   = toUS(raw);
      const type = typeSelect.value;
      saveBtn.disabled = !(isValidUS(us) && (type === 'Food' || type === 'Treat'));
    };

    // allow digits typing without slashes
    // --- Expiration Input Handling ---
    expInput.addEventListener('input', e => {
      // Strip all non-numeric characters
      let v = e.target.value.replace(/\D/g, '');

      // Auto-format as MM/DD/YYYY
      if (v.length >= 3 && v.length <= 4) {
        v = v.replace(/^(\d{2})(\d{0,2})/, (_, m, d) => (d ? `${m}/${d}` : `${m}`));
      } else if (v.length > 4) {
        v = v.replace(/^(\d{2})(\d{2})(\d{0,4}).*/, (_, m, d, y) => `${m}/${d}/${y}`);
      }

      e.target.value = v.slice(0, 10); // limit to 10 chars total
      updateSaveBtn();
    });

    // Allow manual edits or date picker updates
    expInput.addEventListener('change', e => {
      console.log('[revExp change]', e.target.value);
      updateSaveBtn();
    });

    typeSelect?.addEventListener('change', updateSaveBtn);

    saveBtn?.addEventListener('click', async () => {
      const expRaw = expInput.value.trim();
      const expUS  = toUS(expRaw);
      const type   = typeSelect.value;
      if (!isValidUS(expUS)) return;

      Object.assign(state.item, {
        species:    $('#revSpecies').value,
        lifestage:  $('#revStage').value,
        brand:      $('#revBrand').value.trim(),
        productName:$('#revName').value.trim(),
        flavor:     $('#revFlavor').value.trim(),
        ingredients:$('#revIngredients').value.trim(),
        type
      });
      state.exp = expUS;

      setMsg(status, 'Generating label…');
      spinner(true, load);

      let res;
      try {
        res = await API.createLabels({
          upc: state.upc,
          ...state.item,
          expiration: expUS
        });
      } catch (err) {
        console.error('[create label error]', err);
        setMsg(status, 'Failed to create label.', 'error');
        spinner(false, load);
        return;
      }

      if (!res || !res.ok || !res.data || !res.data.pdfUrl) {
        setMsg(status, 'Label creation failed.', 'error');
        spinner(false, load);
        return;
      }

      const { pdfUrl, fileId } = res.data;
      state.pdf = { url: pdfUrl, id: fileId };

      // open + show link
      try { window.open(pdfUrl, '_blank'); } catch {}
      const link  = $('#pdfLink');
      const block = $('#pdfLinkBlock');
      if (link && block) {
        link.href = pdfUrl;
        link.textContent = 'View Label PDF';
        block.classList.remove('hidden');
      }

      spinner(false, load);
      setMsg(status, 'Label created successfully!', 'success');
    });

    // initial state
    updateSaveBtn();
  }

  // ──────────────────────────────────────────────────────────────
  // New item photo flow
  // ──────────────────────────────────────────────────────────────
  function wireNewItem() {
    const msg      = $('#newStatus');
    const spin     = $('#newLoad');
    const nextBtn  = $('#photoContinue');
    const actions  = $('#photoActions');
    const ingBlock = $('#ingredientsBlock');
    const frontBlk = $('#frontBlock');

    $('#frontBtn')?.addEventListener('click', () => {
      // scroll to the area before/while opening the camera overlay
      smoothScroll(frontBlk);
      captureImage((dataUrl) => {
        state.photos.front = dataUrl;
        const img = $('#frontPreview');
        img.src = dataUrl; img.classList.remove('hidden');
        ingBlock?.classList.remove('hidden');
        checkReady();
        smoothScroll(ingBlock); // bring step 2 into view next
      });
    });

    $('#ingredientsBtn')?.addEventListener('click', () => {
      smoothScroll(ingBlock);
      captureImage((dataUrl) => {
        state.photos.ingredients = dataUrl;
        const img = $('#ingredientsPreview');
        img.src = dataUrl; img.classList.remove('hidden');
        checkReady();
        smoothScroll(actions); // bring Continue into view
      });
    });

    nextBtn?.addEventListener('click', async () => {
      const front = state.photos.front;
      const ing   = state.photos.ingredients;

      if (!front || !ing || front.length < 100 || ing.length < 100) {
        setMsg(msg, 'Missing or invalid image(s).', 'error');
        return;
      }

      // friendly processing screen
      showProcessing('ChatGPT is now judging your photography skills… please stand by.');
      setMsg(msg, 'Extracting label data…', 'success');
      spinner(true, spin);

      try {
        const extracted = await API.extract({ frontDataUrl: front, ingDataUrl: ing });
        if (!extracted?.ok || typeof extracted.data !== 'object') {
          throw new Error('AI extract failed');
        }

        state.item = normalizeItem({ upc: state.upc, ...extracted.data });

        navigate('screenReview');
        renderReview();
        setTimeout(() => smoothScroll($('#screenReview'), 'start'), 50);
      } catch (err) {
        console.error('[extract error]', err);
        setMsg(msg, 'AI extraction failed.', 'error');
      } finally {
        spinner(false, spin);
        hideProcessing();
      }
    });

    function checkReady() {
      if (state.photos.front && state.photos.ingredients) {
        actions?.classList.remove('hidden');
      }
    }
  }

  // Camera overlay (full screen)
  function captureImage(callback) {
    const overlay = document.createElement('div');
    overlay.className = 'camera-overlay';
    overlay.style.cssText = `
      position:fixed; inset:0; background:#000; z-index:9998;
      display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1rem; padding:1rem;
    `;
    overlay.innerHTML = `
      <video autoplay playsinline style="width:100%; max-width:900px; border-radius:12px;"></video>
      <div class="actions" style="width:100%; max-width:900px;">
        <button class="btn take">📸 Take Photo</button>
        <button class="btn secondary cancel">Cancel</button>
      </div>
    `;
    document.body.appendChild(overlay);

    const video  = overlay.querySelector('video');
    const take   = overlay.querySelector('.take');
    const cancel = overlay.querySelector('.cancel');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then((stream) => {
        video.srcObject = stream;

        const cleanup = () => {
          try { stream.getTracks().forEach(t => t.stop()); } catch {}
          overlay.remove();
        };

        take.onclick = () => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext('2d').drawImage(video, 0, 0);
          const url = canvas.toDataURL('image/jpeg', 0.92);
          cleanup();
          callback(url);
        };

        cancel.onclick = cleanup;
      })
      .catch((err) => {
        console.error('[camera error]', err);
        overlay.remove();
        setMsg($('#newStatus'), 'Camera not available', 'error');
      });
  }

  // ──────────────────────────────────────────────────────────────
  // Boot
  // ──────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    wireGlobal();
    wireLaunch();
    wireNewItem();
    wireReviewScreen();
    navigate('screenLaunch');
  });
})();
</script>
